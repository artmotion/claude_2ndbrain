# 2ndBrain server — production Compose bundle (server + Postgres).
#
#   cp .env.example .env    # then edit it: JWT_SECRET and POSTGRES_PASSWORD are required
#   docker compose up -d
#
# This is the self-host path for people who want one command and a machine they
# control. It is NOT the dev stack — `app/apps/server/docker-compose.yml` is that
# one, and it runs Postgres alone so `pnpm run dev` can talk to it.
#
# What you get: Postgres with a persistent volume, migrations applied before the
# server ever accepts traffic, and exactly one HTTP port exposed. The Hocuspocus
# WebSocket rides that same port at /sync, so there is no second port to open and
# no second hostname to configure.
name: secondbrain

# The server and the migration job are the same image with the same environment;
# only the command differs. Anchors keep them from drifting apart.
x-server-image: &server-image
  build:
    context: ../..
    dockerfile: app/apps/server/Dockerfile

x-server-env: &server-env
  NODE_ENV: production
  # Compose resolves this against the postgres service below, on the internal
  # network — Postgres is never published to the host.
  # The password travels in PGPASSWORD, NOT inside the URL: node-postgres
  # parses DATABASE_URL as a URL, so a password with `/`, `+`, `=`, `@` or `#`
  # (e.g. from `openssl rand -base64`) crashed every connection with
  # "Invalid URL". pg reads PGPASSWORD when the URL carries no password.
  DATABASE_URL: postgres://secondbrain@postgres:5432/secondbrain
  PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — openssl rand -base64 32}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL in .env — the public https URL clients reach}
  # The admin panel at /admin (create and manage accounts; there is no
  # self sign-up). Empty or shorter than 12 characters ⇒ the panel is off.
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  PORT: "3010"

services:
  postgres:
    # Debian-based (glibc), never Alpine. A data directory belongs to one libc
    # family and one major version: switching either means dump → fresh
    # db_volume → restore.
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: secondbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: secondbrain
    volumes:
      # The durable copy of everything the server holds: every note's CRDT
      # history, accounts, permissions and (by default) attachment bytes. A
      # host folder in the project's data/ directory (git-ignored), so it
      # survives container restarts, rebuilds and `docker compose down -v`.
      # Back it up.
      # On Docker Desktop for Windows, a bind mount on an NTFS drive can break
      # Postgres (wrong ownership/permissions): set DB_VOLUME to a WSL path
      # (\\wsl$\...) or to a named volume such as `secondbrain_pgdata`.
      - ${DB_VOLUME:-../../data/db_volume}:/var/lib/postgresql/data
    # "Is Postgres accepting connections yet?" pg_isready ships with the
    # postgres image and exits 0 once the database answers. The migrate job
    # below waits for this (`condition: service_healthy`), so migrations never
    # run against a database that is still starting up.
    #
    # `-h 127.0.0.1` matters: on the FIRST start the image initialises the
    # database with a temporary server that listens on the Unix socket only
    # (listen_addresses=''). A socket check passes during that phase, so
    # migrate connected over TCP too early and got ECONNREFUSED (seen with a
    # slow first start on Docker Desktop for Windows). A TCP check only passes
    # once the real server is up.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "secondbrain", "-d", "secondbrain"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Runs to completion, then the server starts: schema changes land before anything serves traffic, so a
  # deploy can never briefly answer requests against an old schema.
  migrate:
    <<: *server-image
    command: ["node", "dist/db/migrate.js"]
    environment: *server-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    <<: *server-image
    environment: *server-env
    # Bind to localhost by default. Putting this straight on 0.0.0.0 would serve
    # the API over plain HTTP to the internet; terminate TLS in front of it (see
    # the README) and let the proxy reach this port.
    ports:
      # PUBLIC_PORT is the port on the HOST; inside the container the server
      # always listens on 3010.
      - "${BIND_ADDR:-127.0.0.1}:${PUBLIC_PORT:-3010}:3010"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # "Does the server answer?" Requests GET /health inside the container and
    # fails on any error or non-2xx answer (curl is installed in the image for
    # exactly this). `docker compose ps` shows healthy / unhealthy.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3010/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # OPTIONAL: `docker compose --profile tunnel up -d`. Runs a Cloudflare Tunnel
  # inside the stack, so the server gets a public HTTPS hostname without any
  # port opened on your router. In the Cloudflare dashboard, point the tunnel's
  # public hostname at http://server:3010 (this service reaches the server on
  # the internal network) and set BETTER_AUTH_URL to that https:// hostname.
  # Running cloudflared elsewhere instead (e.g. unraid's plugin)? Leave this
  # off and point it at http://<host>:${PUBLIC_PORT}.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # OPTIONAL, and off unless you ask for it: `docker compose --profile minio up -d`.
  # A plain `docker compose up -d` never starts it, so the zero-configuration
  # path (attachments in Postgres) is completely unaffected by this block.
  #
  # MinIO is an S3-compatible object store you run yourself. Point the server at
  # it when you want attachments out of the database — big videos, a Postgres
  # you would rather keep small, or backups that do not carry every byte of
  # every file.
  #
  # First run, once, to create the bucket:
  #   docker compose --profile minio up -d minio
  #   docker compose exec minio mc alias set local http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
  #   docker compose exec minio mc mb local/secondbrain
  #
  # Then add these to x-server-env above (and restart the server):
  #   BLOB_STORAGE: s3
  #   S3_ENDPOINT: http://minio:9000     # the INTERNAL name; see the note below
  #   S3_BUCKET: secondbrain
  #   S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  #   S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  #   S3_FORCE_PATH_STYLE: "true"        # MinIO has no bucket-per-subdomain DNS
  #   S3_PROXY_DOWNLOADS: "1"            # see below
  #
  # THE ENDPOINT IS THE PART PEOPLE GET WRONG. Presigned URLs are handed to the
  # CLIENT, so the endpoint the server signs must be an address the client can
  # reach. `http://minio:9000` only resolves inside this network — which is
  # exactly why `S3_PROXY_DOWNLOADS=1` is suggested above: with it, downloads
  # stream through the server and never leak an unreachable URL. Uploads are
  # still presigned, so for a client-reachable MinIO publish the port below and
  # set S3_ENDPOINT to the public address instead — terminate TLS in front of it
  # the same way you do for the API, since a webview will not upload to plain
  # http from an https page.
  minio:
    image: quay.io/minio/minio:latest
    profiles: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # Not `:?`-required: Compose interpolates every service, profiles
      # included, so a required variable here would block a plain
      # `docker compose up` that never starts MinIO. MinIO itself refuses to
      # start without a password (min. 8 characters).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-secondbrain}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      # Attachment bytes once BLOB_STORAGE=s3 (notes themselves always stay in
      # Postgres). A host folder in data/, like db_volume. Back it up.
      - ${DATA_VOLUME:-../../data/data_volume}:/data
    # Not published by default — the server reaches it on the internal network.
    # Uncomment to expose the API (9000) and the web console (9001) on the host.
    # ports:
    #   - "127.0.0.1:9000:9000"
    #   - "127.0.0.1:9001:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

# Uncomment only if you point DB_VOLUME or DATA_VOLUME at a named volume
# instead of a host folder (e.g. DB_VOLUME=secondbrain_pgdata on Windows).
# volumes:
#   secondbrain_pgdata:
#   secondbrain_minio:
